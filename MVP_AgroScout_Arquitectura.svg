  <g font-size="10.5">
    <rect x="60" y="260" width="250" height="110" rx="6" fill="#fff" stroke="#2e7d32"/>
    <text x="185" y="282" text-anchor="middle" font-weight="bold" font-size="12" fill="#1b5e20">1 · InterpretarInsumo</text>
    <text x="185" y="304" text-anchor="middle" fill="#444">glm-4.7-flashx + instructor</text>
    <text x="185" y="320" text-anchor="middle" fill="#444">sinónimos ES/EN visibles en la UI</text>
    <text x="185" y="336" text-anchor="middle" fill="#444">JSON validado (Pydantic)</text>

    <rect x="335" y="260" width="250" height="110" rx="6" fill="#fff" stroke="#1b5e20" stroke-width="2"/>
    <text x="460" y="282" text-anchor="middle" font-weight="bold" font-size="12" fill="#1b5e20">2 · BuscarProductosSimilares</text>
