    <text x="460" y="320" text-anchor="middle" fill="#444">subset OFF + USDA · 7 cultivos</text>
    <text x="460" y="336" text-anchor="middle" font-style="italic" fill="#888">sin LLM · 100% local</text>

    <rect x="610" y="260" width="250" height="110" rx="6" fill="#fff" stroke="#2e7d32"/>
    <text x="735" y="282" text-anchor="middle" font-weight="bold" font-size="12" fill="#1b5e20">3 · GenerarInsightDeMercado</text>
    <text x="735" y="304" text-anchor="middle" fill="#444">glm-4.7 (Z.ai)</text>
    <text x="735" y="320" text-anchor="middle" fill="#444">solo datos recuperados</text>
    <text x="735" y="336" text-anchor="middle" fill="#444">citas: fuente + fecha por producto</text>

    <rect x="885" y="260" width="250" height="110" rx="6" fill="#fff" stroke="#2e7d32"/>
    <text x="1010" y="282" text-anchor="middle" font-weight="bold" font-size="12" fill="#1b5e20">4 · EmitirInformeSimple</text>
    <text x="1010" y="304" text-anchor="middle" fill="#444">Jinja2 (HTML) → WeasyPrint (PDF)</text>
    <text x="1010" y="320" text-anchor="middle" fill="#444">descargable desde la UI</text>
    <text x="1010" y="336" text-anchor="middle" font-style="italic" fill="#888">sin LLM</text>
  </g>
  <line x1="310" y1="315" x2="333" y2="315" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="585" y1="315" x2="608" y2="315" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="315" x2="883" y2="315" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M460,370 V385 H1010 V372" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="560" y="382" font-size="10" fill="#2e7d32">guard: 0-2 productos → informe parcial honesto ("hueco de mercado") — momento clave de la demo</text>

