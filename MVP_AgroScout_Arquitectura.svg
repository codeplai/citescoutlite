    <rect x="60" y="648" width="350" height="92" rx="6" fill="#fff" stroke="#b8860b"/>
    <text x="235" y="668" text-anchor="middle" font-weight="bold" font-size="12" fill="#7a5c00">Desarrollo / demo (laptop)</text>
    <text x="235" y="688" text-anchor="middle" fill="#555">4 núcleos · 16 GB RAM · 20 GB disco · sin GPU</text>
    <text x="235" y="704" text-anchor="middle" fill="#555">Python 3.12 · FastAPI · instructor · lancedb ·</text>
    <text x="235" y="720" text-anchor="middle" fill="#555">duckdb · weasyprint · Vue 3/Vite (Node 18+)</text>

    <rect x="435" y="648" width="350" height="92" rx="6" fill="#fff" stroke="#b8860b"/>
    <text x="610" y="668" text-anchor="middle" font-weight="bold" font-size="12" fill="#7a5c00">Piloto (servidor)</text>
    <text x="610" y="688" text-anchor="middle" fill="#555">ReliableSite clearance US$ 49-79/mes</text>
    <text x="610" y="704" text-anchor="middle" fill="#555">(≥32 GB RAM, NVMe) — o la misma laptop</text>
    <text x="610" y="720" text-anchor="middle" fill="#555">Ubuntu 22.04 · Caddy (TLS) · promptfoo (Node 18+)</text>

    <rect x="810" y="648" width="330" height="92" rx="6" fill="#fff" stroke="#b8860b"/>
    <text x="975" y="668" text-anchor="middle" font-weight="bold" font-size="12" fill="#7a5c00">Cuentas y claves</text>
    <text x="975" y="688" text-anchor="middle" fill="#555">ZAI_API_KEY (prepago, US$ 5 sobran)</text>
    <text x="975" y="704" text-anchor="middle" fill="#555">USDA_API_KEY (gratis, registro inmediato)</text>
    <text x="975" y="720" text-anchor="middle" fill="#555">Mistral / Supabase / openFDA: no aún</text>
  </g>

  <text x="1160" y="782" text-anchor="end" font-size="10.5" font-style="italic" fill="#777">AgroScout IA Lite · MVP Python (etapas 1-3) · LLM GLM (Z.ai) · 6-9 semanas · CITEagroindustrial Chavimochic — Julio 2026</text>
