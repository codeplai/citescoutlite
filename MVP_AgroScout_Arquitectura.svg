  <rect x="40" y="440" width="1120" height="140" rx="8" fill="#e3f0fa" stroke="#1565c0" stroke-width="1.5"/>
  <text x="55" y="460" font-size="12" font-weight="bold" fill="#1565c0">DATOS LOCALES (archivos, sin servidores de BD) + SERVICIO EXTERNO</text>

  <path d="M80,485 a130,11 0 0,1 260,0 v60 a130,11 0 0,1 -260,0 z" fill="#fff" stroke="#1565c0"/>
  <ellipse cx="210" cy="485" rx="130" ry="11" fill="#fff" stroke="#1565c0"/>
  <text x="210" y="512" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0d47a1">LanceDB + DuckDB</text>
  <text x="210" y="530" text-anchor="middle" font-size="10.5" fill="#555">subset OFF (~1-2 GB) + USDA (~200 MB)</text>
  <text x="210" y="545" text-anchor="middle" font-size="10.5" fill="#555">índice vectorial ~0.5-1 GB</text>

  <rect x="390" y="480" width="240" height="80" rx="6" fill="#fff" stroke="#1565c0"/>
  <text x="510" y="505" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0d47a1">Embeddings bge-m3</text>
  <text x="510" y="524" text-anchor="middle" font-size="10.5" fill="#555">sentence-transformers · CPU</text>
  <text x="510" y="540" text-anchor="middle" font-size="10.5" fill="#555">~2-3 GB RAM · sin GPU · gratis</text>

  <rect x="670" y="480" width="240" height="80" rx="6" fill="#fff" stroke="#b8860b"/>
  <text x="790" y="505" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c00">ETL inicial (una vez)</text>
  <text x="790" y="524" text-anchor="middle" font-size="10.5" fill="#555">cargar_off.py · cargar_usda.py</text>
  <text x="790" y="540" text-anchor="middle" font-size="10.5" fill="#555">indexado 1-3 h en CPU</text>

  <rect x="950" y="480" width="190" height="80" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
  <text x="1045" y="505" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c00">API Z.ai (GLM)</text>
  <text x="1045" y="524" text-anchor="middle" font-size="10.5" fill="#555">glm-4.7-flashx · glm-4.7</text>
  <text x="1045" y="540" text-anchor="middle" font-size="10.5" fill="#555">etapas 1 y 3 · US$ 5 sobran</text>

  <!-- conectores -->
  <path d="M460,400 V445 H210 V472" fill="none" stroke="#1565c0" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <path d="M390,520 H345" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="352" y="514" font-size="9.5" fill="#1565c0">indexa</text>
  <path d="M670,520 H645" fill="none" stroke="#b8860b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <path d="M950,410 V445 H1045 V476" fill="none" stroke="#b8860b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
