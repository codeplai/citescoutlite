[project]
name = "agroscout-mvp"
version = "0.1.0"
description = "AgroScout IA Lite MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.2",
    "instructor>=1.6.4",
    "litellm>=1.49.2",
    "tenacity>=9.0.0",
    "lancedb>=0.14.0",
    "duckdb>=1.1.2",
    "weasyprint>=63.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.3",
    "markdown>=3.1.4",
    "requests>=2.31.0",
    "xhtml2pdf>=0.2.15",
]

[project.scripts]
api = "api.main:start"
etl = "etl.indexar_vectores:main"
evals = "evals.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dominio", "casos_de_uso", "puertos", "adaptadores", "api", "etl", "evals"]
