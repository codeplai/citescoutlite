[project]
name = "agroscout-mvp"
version = "0.1.0"
description = "AgroScout IA Lite MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.2",
    "instructor>=1.6.4",
    # 1.92 movio el cliente a un bridge de Rust y dejo de publicar wheel
    # universal; 1.94.1 es la primera que vuelve a traer wheel de Windows.
    # Por debajo de ese piso, uv compila desde sdist y exige MSVC.
    "litellm>=1.94.1",
    "tenacity>=9.0.0",
    "lancedb>=0.14.0",
    "duckdb>=1.1.2",
    "weasyprint>=63.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.3",
    "markdown>=3.1.4",
    "requests>=2.31.0",
    "xhtml2pdf>=0.2.15",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "sentence-transformers>=2.2.2",
    "pdfplumber>=0.11.0",
    "psycopg[binary,pool]>=3.2",
    "supabase>=2.0.0",
    "procrastinate>=2.0.0",
    "pydantic-ai>=0.2.0",
    # El agente de S2 la importa a nivel de modulo, y de ahi cuelga la cadena
    # api.main -> discovery -> cascada -> agente. Estaba solo en
    # requirements.txt, asi que con uv (que lee este archivo) la API no
    # levantaba: ModuleNotFoundError: No module named 'tavily'.
    "tavily-python>=0.3.0",
    "trafilatura>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "redis>=5.0.0",
]

[project.scripts]
api = "api.main:start"
etl = "etl.indexar_vectores:main"
evals = "evals.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dominio", "casos_de_uso", "puertos", "adaptadores", "api", "etl", "evals"]
